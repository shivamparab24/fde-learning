services:
  postgres:
    image: pgvector/pgvector:pg13
    container_name: fde_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: "no"

volumes:
  postgres_data:
